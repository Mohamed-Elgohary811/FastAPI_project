<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Records</title>
<style>
  :root {
    --bg: #eef2f1;
    --panel: #ffffff;
    --ink: #1c2b2a;
    --muted: #5d706e;
    --line: #cfdad8;
    --accent: #1f6f6b;
    --accent-ink: #ffffff;
    --danger: #a63d2f;
    --good: #2e7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121b1a; --panel: #1a2625; --ink: #e5eeec; --muted: #9bb0ad;
      --line: #2e413f; --accent: #4fb3ad; --accent-ink: #0d1a19;
      --danger: #e27d6e; --good: #6cc18b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 2rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px; margin-bottom: 20px;
  }
  h2 { font-family: Georgia, serif; font-size: 1.15rem; margin: 0 0 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  label { display: flex; flex-direction: column; font-size: .85rem; color: var(--muted); gap: 4px; flex: 1 1 120px; }
  input {
    font: inherit; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--bg); color: var(--ink); width: 100%;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  button {
    font: inherit; cursor: pointer; padding: 8px 14px; border-radius: 6px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  }
  button.ghost { background: transparent; color: var(--accent); }
  button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  button.small { padding: 4px 10px; font-size: .85rem; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; color: var(--muted); font-size: .85rem; }
  td.actions { display: flex; gap: 6px; justify-content: flex-end; }
  td input { padding: 4px 6px; }
  .grade { font-weight: 600; }
  .empty { color: var(--muted); padding: 16px 0 4px; }
  #status { min-height: 1.4em; font-size: .9rem; margin: 0 0 12px; }
  #status.err { color: var(--danger); }
  #status.ok { color: var(--good); }
  .api { display: flex; gap: 8px; align-items: flex-end; }
  .api label { flex: 1; }
</style>
</head>
<body>
<main>
  <h1>Student records</h1>
  <p class="sub">Add, edit and remove students stored in your FastAPI backend.</p>

  <div class="panel api">
    <label>API address
      <input id="apiUrl" value="" placeholder="same origin" spellcheck="false">
    </label>
    <button class="ghost" id="reload">Reload</button>
  </div>

  <p id="status" role="status" aria-live="polite"></p>

  <div class="panel">
    <h2>Add a student</h2>
    <div class="row">
      <label>ID <input id="newId" type="number" min="1"></label>
      <label>Name <input id="newName" type="text"></label>
      <label>Grade <input id="newGrade" type="number"></label>
      <button id="addBtn">Add student</button>
    </div>
  </div>

  <div class="panel">
    <h2>Students</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>Grade</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="empty" id="empty" hidden>No students yet. Add one above.</p>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const base = () => $("apiUrl").value.replace(/\/+$/, "");
  let students = [];
  let editingId = null;

  function say(msg, type = "") {
    const s = $("status");
    s.textContent = msg;
    s.className = type;
  }

  async function api(path, options = {}) {
    const res = await fetch(base() + path, {
      headers: { "Content-Type": "application/json" },
      ...options
    });
    if (!res.ok) {
      let detail = res.statusText;
      try { detail = JSON.stringify((await res.json()).detail ?? detail); } catch {}
      throw new Error(res.status + ": " + detail);
    }
    return res.json();
  }

  async function load() {
    try {
      students = await api("/students/");
      render();
      say("Loaded " + students.length + " student(s).", "ok");
    } catch (e) {
      students = [];
      render();
      say("Can't reach the API at " + base() + ". Check that the server is running. (" + e.message + ")", "err");
    }
  }

  function esc(v) {
    const d = document.createElement("div");
    d.textContent = v;
    return d.innerHTML;
  }

  function render() {
    $("empty").hidden = students.length > 0;
    $("rows").innerHTML = students.map(s => {
      if (s.id === editingId) {
        return `<tr>
          <td>${s.id}</td>
          <td><input id="editName" value="${esc(s.name).replace(/"/g, "&quot;")}"></td>
          <td><input id="editGrade" type="number" value="${s.grade}"></td>
          <td class="actions">
            <button class="small" data-act="save" data-id="${s.id}">Save changes</button>
            <button class="small ghost" data-act="cancel">Cancel</button>
          </td></tr>`;
      }
      return `<tr>
        <td>${s.id}</td><td>${esc(s.name)}</td><td class="grade">${s.grade}</td>
        <td class="actions">
          <button class="small ghost" data-act="edit" data-id="${s.id}">Edit</button>
          <button class="small danger" data-act="delete" data-id="${s.id}">Delete</button>
        </td></tr>`;
    }).join("");
  }

  $("addBtn").onclick = async () => {
    const id = parseInt($("newId").value, 10);
    const name = $("newName").value.trim();
    const grade = parseInt($("newGrade").value, 10);
    if (Number.isNaN(id) || !name || Number.isNaN(grade)) {
      return say("Enter an ID, a name and a grade before adding.", "err");
    }
    if (students.some(s => s.id === id)) {
      return say("ID " + id + " is already used. Pick a different ID.", "err");
    }
    try {
      await api("/students/", { method: "POST", body: JSON.stringify({ id, name, grade }) });
      $("newId").value = $("newName").value = $("newGrade").value = "";
      await load();
      say("Student added.", "ok");
    } catch (e) { say("Couldn't add the student. " + e.message, "err"); }
  };

  $("rows").onclick = async e => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const id = parseInt(btn.dataset.id, 10);
    const act = btn.dataset.act;

    if (act === "edit") { editingId = id; render(); }
    else if (act === "cancel") { editingId = null; render(); }
    else if (act === "save") {
      const name = $("editName").value.trim();
      const grade = parseInt($("editGrade").value, 10);
      if (!name || Number.isNaN(grade)) return say("Enter a name and a grade.", "err");
      try {
        const r = await api("/students/" + id, { method: "PUT", body: JSON.stringify({ id, name, grade }) });
        if (r.message) throw new Error(r.message);
        editingId = null;
        await load();
        say("Changes saved.", "ok");
      } catch (err) { say("Couldn't save changes. " + err.message, "err"); }
    }
    else if (act === "delete") {
      if (!confirm("Delete student " + id + "?")) return;
      try {
        await api("/students/" + id, { method: "DELETE" });
        await load();
        say("Student deleted.", "ok");
      } catch (err) { say("Couldn't delete the student. " + err.message, "err"); }
    }
  };

  $("reload").onclick = load;
  $("apiUrl").addEventListener("keydown", e => { if (e.key === "Enter") load(); });
  load();
</script>
</body>
</html>
